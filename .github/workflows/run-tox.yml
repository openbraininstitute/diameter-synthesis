name: Run tox

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            tox-env: py310
          - python-version: "3.10"
            tox-env: min_versions
          - python-version: "3.11"
            tox-env: py311
          - python-version: "3.11"
            tox-env: lint
          - python-version: "3.12"
            tox-env: py312
          - python-version: "3.12"
            tox-env: docs
          - python-version: "3.13"
            tox-env: py313
            codecov: codecov
          - python-version: "3.13"
            tox-env: check-packaging
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        if: startsWith(matrix.tox-env, 'py')
        run: sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade tox tox-uv
      - name: Run tox
        run: tox run -e ${{ matrix.tox-env }}
      - name: Upload to codecov
        if: ${{ matrix.codecov == 'codecov' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: ./reports/coverage-py313.xml
          flags: pytest
          verbose: true
          name: "${{ github.repository }}-${{ matrix.tox-env }}"
