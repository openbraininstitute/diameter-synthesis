[base]
name = diameter_synthesis
files = {[base]name} tests docs/source/conf.py

[tox]
requires =
    tox-uv>=1
envlist =
    check-packaging
    lint
    docs
    min_versions
    py{310,311,312,313}
    coverage

minversion = 3.18

[testenv]
setenv =
    COVERAGE_FILE = {env:COVERAGE_FILE:.coverage-{envname}}
extras =
    plot
    test
commands =
    pytest \
        -n {env:PYTEST_NPROCS:'auto'} \
        --basetemp={envtmpdir} \
        --cov={[base]name} \
        --cov-branch \
        --cov-fail-under=80 \
        --no-cov-on-fail \
        --cov-report term-missing \
        --cov-report html:reports/coverage-{envname} \
        --cov-report xml:reports/coverage-{envname}.xml \
        --html reports/pytest-{envname}.html \
        --junit-xml=reports/pytest-{envname}.xml \
        --self-contained-html \
        --durations 10 \
        --durations-min=2.0 \
        {posargs}

[testenv:coverage]
skip_install = true
deps = coverage
allowlist_externals = /bin/bash
commands =
    /bin/bash -c 'coverage combine .coverage-py*'
    coverage xml
    coverage report

[testenv:check-packaging]
skip_install = true
deps =
    build
    twine
commands =
    python -m build -o {envtmpdir}/dist
    twine check {envtmpdir}/dist/*

[testenv:min_versions]
basepython = python3.10
skip_install = true
deps =
    uv
commands_pre =
    uv pip install ".[test]"
commands =
    uv pip freeze

[testenv:lint]
basepython = python3.11
skip_install = true
deps =
    codespell==2.3.0
    ruff>=0.9
commands =
    ruff format --check {[base]files}
    ruff check {[base]files}
    codespell -x .codespellignorelines {[base]files} README.md CHANGELOG.md docs/source

[testenv:format]
basepython = python3.10
skip_install = true
deps =
    codespell==2.3.0
    ruff>=0.9
commands =
    codespell -i 3 -x .codespellignorelines -w {[base]files} README.md CHANGELOG.md docs/source
    ruff format {[base]files}
    ruff check --fix {[base]files}

[testenv:docs]
basepython = python3.12
changedir = docs
extras = docs
allowlist_externals =
    make
# set warnings as errors using the -W sphinx option
commands = make html SPHINXOPTS=-W
